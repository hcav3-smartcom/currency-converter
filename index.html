<!DOCTYPE html>
<html lang="pt=br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Poppins&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title> Currency Converter</title>
</head>

<body>
    <img src="./assets/logo.png" alt="Logo" class="logo">

    <h1>Currency Converter</h1>
    
    <main>
        <label>
            Convert <b>from:</b>:
            <select>
                <option> R$ Brazilian Real </option>
            </select>
        </label>

        <label>
            Convert <b>to:</b>:
            <select class="currency-select">
                <option value="USD"> US$ US Dollar </option>
                <option value="EUR"> € Euro</option>
                <option value="BTC"> ₿ Bitcoin </option>
                <option value="GBP"> £ Libra</option>
            </select>
        </label>

        <label>
            Value:
            <input class="currency-input" type="number" placeholder="Enter the value">
        </label>

        <button class ="convert-button">Convert</button>

        <section>
            <div class="currency-box">
                <img src="./assets/real.png" alt="logo-moeda-a-converter" class="moeda">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

        <img src="./assets/arrow.png" alt="seta" class="arrow">

            <div class="currency-box">
                <img class="currency-img" src="./assets/dolar.png" alt="logo-moeda-a-converter" class="moeda">
                <p class="currency" id="currencyName">Dollar</p>
                <p class="currency-value"> US$ 0,00</p>
            </div>
        </section>
    </main>
</body>

<script src="./script.js"></script>

</html>
